<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – Ashmil Homes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Manrope', sans-serif; background: #f1f5f9; }
    .gradient-gold { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
    .image-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .image-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
  </style>
</head>
<body class="bg-gray-100">

<div class="container mx-auto px-4 py-8">
  <!-- Header -->
  <div class="flex justify-between items-center mb-8">
    <div class="flex items-center gap-3">
      <img src="https://hotgistloaded.com.ng/wp-content/uploads/2026/05/logo-ashmil-DAwsa8ai.jpg" alt="Logo" class="w-12 h-12 rounded-full">
      <h1 class="font-serif text-2xl font-bold text-navy">Ashmil Homes Dashboard</h1>
    </div>
    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-full flex items-center gap-2">
      <i data-lucide="log-out" class="w-4 h-4"></i> Logout
    </button>
  </div>

  <!-- Add Property Form -->
  <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
    <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2">
      <i data-lucide="edit-3" class="w-6 h-6 text-gold"></i> Add / Edit Property
    </h2>
    <form id="propertyForm" class="grid md:grid-cols-2 gap-4">
      <input type="hidden" id="propertyId">
      
      <input type="text" id="title" placeholder="Title *" required class="border rounded-lg p-2">
      <input type="text" id="price" placeholder="Price *" required class="border rounded-lg p-2">
      <input type="text" id="location" placeholder="Location *" required class="border rounded-lg p-2">
      <select id="category" required class="border rounded-lg p-2">
        <option value="houses">Houses for Sale</option>
        <option value="land">Land for Sale</option>
        <option value="shortlets">Shortlets</option>
        <option value="flats">Flats & Apartments</option>
      </select>
      <textarea id="description" placeholder="Description *" rows="3" required class="border rounded-lg p-2 md:col-span-2"></textarea>
      <input type="number" id="bedrooms" placeholder="Bedrooms" class="border rounded-lg p-2">
      <input type="number" id="bathrooms" placeholder="Bathrooms" class="border rounded-lg p-2">
      <input type="text" id="area" placeholder="Area (sq ft)" class="border rounded-lg p-2">
      <div class="flex items-center"><input type="checkbox" id="featured"> <label class="ml-2">Featured Property</label></div>
      
      <!-- Image URLs -->
      <div class="md:col-span-2">
        <label class="block font-medium mb-1"><i data-lucide="image" class="w-4 h-4 inline mr-1"></i> Image URLs (one per line)</label>
        <textarea id="imageUrls" rows="3" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg" class="border rounded-lg p-2 w-full" oninput="previewImages()"></textarea>
        <div id="imagePreview" class="image-preview"></div>
      </div>
      
      <!-- Video URL -->
      <div class="md:col-span-2">
        <label class="block font-medium mb-1"><i data-lucide="video" class="w-4 h-4 inline mr-1"></i> Video URL</label>
        <input type="url" id="videoUrl" placeholder="https://www.youtube.com/embed/xxx or https://vimeo.com/xxx" class="border rounded-lg p-2 w-full" oninput="previewVideo()">
        <div id="videoPreview" class="mt-2"></div>
      </div>
      
      <div class="md:col-span-2 flex gap-3">
        <button type="submit" class="gradient-gold text-navy px-6 py-2 rounded-lg font-semibold flex items-center gap-2">
          <i data-lucide="save" class="w-4 h-4"></i> Save Property
        </button>
        <button type="button" onclick="resetForm()" class="bg-gray-300 px-4 py-2 rounded-lg">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Properties List -->
  <div class="bg-white rounded-2xl shadow-lg p-6">
    <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2">
      <i data-lucide="list" class="w-6 h-6 text-gold"></i> All Properties
    </h2>
    <div id="propertyList" class="grid md:grid-cols-3 gap-4"></div>
  </div>
</div>

<script>
  const token = localStorage.getItem('adminToken');
  if (!token) window.location.href = '/admin/login';

  // ====== IMAGE PREVIEW ======
  function previewImages() {
    const textarea = document.getElementById('imageUrls');
    const preview = document.getElementById('imagePreview');
    const urls = textarea.value.split('\n').map(s => s.trim()).filter(s => s);
    preview.innerHTML = '';
    urls.forEach(url => {
      const img = document.createElement('img');
      img.src = url;
      img.className = 'w-20 h-20 object-cover rounded border';
      img.onerror = () => { img.src = 'https://via.placeholder.com/80?text=Invalid'; };
      preview.appendChild(img);
    });
  }

  // ====== VIDEO PREVIEW ======
  function previewVideo() {
    const url = document.getElementById('videoUrl').value.trim();
    const container = document.getElementById('videoPreview');
    container.innerHTML = '';
    if (!url) return;
    
    let html = '';
    // YouTube embed
    const ytMatch = url.match(/(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    if (ytMatch) {
      html = `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${ytMatch[1]}" frameborder="0" allowfullscreen class="rounded-lg"></iframe>`;
    } 
    // YouTube watch URL
    else if (url.match(/(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/)) {
      const id = url.match(/(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/)[1];
      html = `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen class="rounded-lg"></iframe>`;
    }
    // Vimeo
    else if (url.match(/vimeo\.com\/(\d+)/)) {
      const id = url.match(/vimeo\.com\/(\d+)/)[1];
      html = `<iframe width="100%" height="200" src="https://player.vimeo.com/video/${id}" frameborder="0" allowfullscreen class="rounded-lg"></iframe>`;
    }
    // Direct MP4/WebM
    else if (url.match(/\.(mp4|webm|mov)$/i)) {
      html = `<video controls class="w-full max-h-48 rounded-lg"><source src="${url}" type="video/mp4"></video>`;
    }
    // Generic embed fallback
    else {
      html = `<iframe width="100%" height="200" src="${url}" frameborder="0" allowfullscreen class="rounded-lg"></iframe>`;
    }
    
    container.innerHTML = html;
  }

  // ====== LOAD PROPERTIES ======
  async function loadProperties() {
    try {
      const res = await fetch('/api/admin/properties', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const props = await res.json();
      const container = document.getElementById('propertyList');
      
      if (!props.length) {
        container.innerHTML = '<p class="col-span-full text-center text-gray-500">No properties yet. Add your first one above!</p>';
        return;
      }
      
      container.innerHTML = props.map(p => `
        <div class="border rounded-xl p-3 shadow-sm hover:shadow-md transition">
          <img src="${p.images?.[0] || 'https://via.placeholder.com/300'}" class="w-full h-40 object-cover rounded mb-2" onerror="this.src='https://via.placeholder.com/300'">
          <h3 class="font-bold">${escapeHtml(p.title)}</h3>
          <p class="text-gold font-bold">₦${p.price}</p>
          <p class="text-sm text-gray-500">${escapeHtml(p.location)}</p>
          ${p.video ? '<span class="text-blue-600 text-xs"><i data-lucide="video" class="w-3 h-3 inline mr-1"></i>Video</span>' : ''}
          <div class="flex gap-2 mt-2">
            <button onclick="editProperty('${p.id}')" class="bg-blue-500 text-white px-3 py-1 rounded text-sm flex items-center gap-1">
              <i data-lucide="edit-2" class="w-3 h-3"></i> Edit
            </button>
            <button onclick="deleteProperty('${p.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-sm flex items-center gap-1">
              <i data-lucide="trash-2" class="w-3 h-3"></i> Delete
            </button>
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    } catch (err) {
      console.error('Error loading properties:', err);
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // ====== FORM SUBMIT ======
  document.getElementById('propertyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('propertyId').value;
    const imageUrls = document.getElementById('imageUrls').value.split('\n').map(s => s.trim()).filter(s => s);
    
    const data = {
      title: document.getElementById('title').value,
      description: document.getElementById('description').value,
      price: document.getElementById('price').value,
      location: document.getElementById('location').value,
      category: document.getElementById('category').value,
      bedrooms: parseInt(document.getElementById('bedrooms').value) || 0,
      bathrooms: parseInt(document.getElementById('bathrooms').value) || 0,
      area: document.getElementById('area').value || '',
      featured: document.getElementById('featured').checked,
      images: imageUrls,
      video: document.getElementById('videoUrl').value.trim() || ''
    };

    const url = id ? `/api/admin/properties/${id}` : '/api/admin/properties';
    const method = id ? 'PUT' : 'POST';
    
    try {
      const res = await fetch(url, {
        method,
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });
      
      if (res.ok) {
        alert('Property saved successfully!');
        resetForm();
        loadProperties();
      } else {
        const err = await res.json();
        alert('Error: ' + (err.error || 'Unknown error'));
      }
    } catch (err) {
      alert('Network error: ' + err.message);
    }
  });

  // ====== EDIT PROPERTY ======
  async function editProperty(id) {
    try {
      const res = await fetch(`/api/properties/${id}`);
      const p = await res.json();
      
      document.getElementById('propertyId').value = p.id;
      document.getElementById('title').value = p.title || '';
      document.getElementById('description').value = p.description || '';
      document.getElementById('price').value = p.price || '';
      document.getElementById('location').value = p.location || '';
      document.getElementById('category').value = p.category || 'houses';
      document.getElementById('bedrooms').value = p.bedrooms || '';
      document.getElementById('bathrooms').value = p.bathrooms || '';
      document.getElementById('area').value = p.area || '';
      document.getElementById('featured').checked = p.featured || false;
      
      // Set images
      document.getElementById('imageUrls').value = (p.images || []).join('\n');
      previewImages();
      
      // Set video
      document.getElementById('videoUrl').value = p.video || '';
      previewVideo();
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      alert('Error loading property for edit');
    }
  }

  // ====== DELETE PROPERTY ======
  async function deleteProperty(id) {
    if (!confirm('Delete this property permanently?')) return;
    try {
      await fetch(`/api/admin/properties/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      loadProperties();
    } catch (err) {
      alert('Error deleting property');
    }
  }

  // ====== RESET FORM ======
  function resetForm() {
    document.getElementById('propertyForm').reset();
    document.getElementById('propertyId').value = '';
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('videoPreview').innerHTML = '';
    document.getElementById('imageUrls').value = '';
    document.getElementById('videoUrl').value = '';
  }

  // ====== LOGOUT ======
  function logout() {
    localStorage.removeItem('adminToken');
    window.location.href = '/admin/login';
  }

  // ====== INIT ======
  document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    loadProperties();
  });
</script>
</body>
</html>
