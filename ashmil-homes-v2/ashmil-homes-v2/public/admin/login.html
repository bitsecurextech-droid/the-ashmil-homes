<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A1A2F">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Ashmil Homes administrator portal.">
  <title>Admin Login — Ashmil Homes</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0A1A2F;
      --navy-deep: #051020;
      --gold: #D4AF37;
      --gold-dark: #B8860B;
      --red: #ef4444;
      --green: #10b981;
    }
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Manrope', sans-serif;
      overflow-x: hidden;
      background: linear-gradient(135deg, #0A1A2F 0%, #051020 100%);
    }
    h1, h2, h3, .font-serif { font-family: 'Fraunces', serif; letter-spacing: -0.01em; }

    .bg-navy { background-color: var(--navy); }
    .bg-navy-deep { background-color: var(--navy-deep); }
    .text-navy { color: var(--navy); }
    .text-gold { color: var(--gold); }
    .ring-gold\/30 { --tw-ring-color: rgba(212,175,55,0.3); }
    .ring-gold\/60 { --tw-ring-color: rgba(212,175,55,0.6); }

    .gradient-gold { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
    .shadow-gold { box-shadow: 0 4px 14px rgba(212,175,55,0.35); }
    .shadow-lift { box-shadow: 0 18px 40px -12px rgba(5,16,32,0.35); }

    /* Decorative background pattern behind the card */
    .page-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(212,175,55,0.10) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(212,175,55,0.08) 0%, transparent 45%);
    }

    /* Glass card */
    .glass-card {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212,175,55,0.2);
      position: relative;
      z-index: 1;
      animation: cardIn .5s cubic-bezier(.4,0,.2,1);
    }
    @media (prefers-reduced-motion: reduce) {
      .glass-card { animation: none; }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Field with left icon */
    .field-wrap { position: relative; }
    .field-wrap .f-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
      transition: color .2s ease;
    }
    .field-wrap .f-icon-right {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 0.5rem;
      transition: color .2s ease, background .2s ease;
      background: transparent;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .field-wrap .f-icon-right:hover {
      color: var(--navy);
      background: rgba(10,26,47,0.06);
    }
    .field-wrap:focus-within .f-icon { color: var(--gold); }

    .field {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.75rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      background: #fff;
      color: var(--navy);
      font-size: 1rem;
      transition: border-color .2s ease, box-shadow .2s ease;
      outline: none;
    }
    .field::placeholder { color: #9ca3af; }
    .field:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.18);
    }
    .field.error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
    }
    .field-wrap.has-toggle .field { padding-right: 3rem; }

    .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 0.875rem 1rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.9375rem;
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: opacity .2s ease, transform .15s ease;
      cursor: pointer;
      border: 0;
    }
    .submit-btn:disabled {
      opacity: 0.75;
      cursor: wait;
    }
    .submit-btn:not(:disabled):active { transform: scale(0.985); }

    .spinner-dark {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(10,26,47,0.25);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error banner */
    .error-banner {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      border-radius: 0.75rem;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #991b1b;
      font-size: 0.875rem;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: 0;
      transition: max-height .3s ease, opacity .25s ease, padding .3s ease, margin .3s ease;
    }
    .error-banner.show {
      max-height: 200px;
      opacity: 1;
      padding-top: 0.875rem;
      padding-bottom: 0.875rem;
      margin-bottom: 1rem;
    }
    .error-banner .err-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    /* Remember me checkbox */
    .check-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.875rem;
      color: #4b5563;
    }
    .check-row input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: var(--gold-dark);
      cursor: pointer;
    }

    /* Cap-lock warning (shows when caps lock is on in password field) */
    .caps-warn {
      display: none;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #b45309;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 0.5rem;
      padding: 0.4rem 0.6rem;
      margin-top: 0.5rem;
    }
    .caps-warn.show { display: flex; }

    /* Back to site link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.65);
      transition: color .2s ease;
      margin-top: 1.5rem;
      text-align: center;
      justify-content: center;
      width: 100%;
    }
    .back-link:hover { color: var(--gold); }

    /* Safe area */
    .safe-pad {
      padding-top: max(env(safe-area-inset-top), 1rem);
      padding-bottom: max(env(safe-area-inset-bottom), 1rem);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 safe-pad">

  <div class="page-bg"></div>

  <div class="w-full max-w-md">

    <!-- ================= LOGIN CARD ================= -->
    <div class="glass-card rounded-2xl shadow-lift p-7 md:p-9">

      <!-- Brand -->
      <div class="text-center mb-7">
        <!-- NOTE: swap to Supabase-hosted logo (site-assets/logo.jpg) in the deferred asset pass. -->
        <img src="https://hotgistloaded.com.ng/wp-content/uploads/2026/05/logo-ashmil-DAwsa8ai.jpg"
             alt="Ashmil Homes logo"
             width="80" height="80"
             class="w-20 h-20 rounded-full mx-auto ring-4 ring-gold/30 shadow-gold object-cover mb-3">
        <h1 class="font-serif text-2xl md:text-3xl font-bold text-navy leading-tight">Ashmil Homes</h1>
        <p class="text-gray-500 text-sm mt-1">Administrator Portal</p>
      </div>

      <!-- Error banner (hidden by default) -->
      <div id="errorBanner" class="error-banner" role="alert" aria-live="polite">
        <div class="err-icon">
          <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
        </div>
        <div id="errorText" class="flex-1 leading-snug">Invalid email or password.</div>
      </div>

      <!-- Form -->
      <form id="loginForm" novalidate autocomplete="on">

        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="field-label">Email Address</label>
          <div class="field-wrap">
            <i data-lucide="mail" class="f-icon w-4 h-4"></i>
            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              required
              placeholder="admin@ashmil.com"
              class="field">
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="field-label">Password</label>
          <div class="field-wrap has-toggle">
            <i data-lucide="lock" class="f-icon w-4 h-4"></i>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Enter your password"
              class="field">
            <button type="button" id="togglePassword" class="f-icon-right" aria-label="Show password" aria-pressed="false">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
          <div id="capsWarn" class="caps-warn">
            <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>
            <span>Caps Lock is on</span>
          </div>
        </div>

        <!-- Remember + status row -->
        <div class="flex items-center justify-between mb-5 gap-3 flex-wrap">
          <label class="check-row" for="remember">
            <input type="checkbox" id="remember" name="remember">
            <span>Keep me signed in</span>
          </label>
          <span class="text-xs text-gray-400">Session expires after 7 days</span>
        </div>

        <!-- Submit -->
        <button type="submit" id="submitBtn" class="submit-btn gradient-gold shadow-gold">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span id="submitLabel">Sign In</span>
        </button>

      </form>

      <!-- Divider -->
      <div class="my-6 flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400 uppercase tracking-widest">Secure Area</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <p class="text-xs text-gray-500 text-center leading-relaxed">
        This portal is for authorised administrators only. All access is logged.
      </p>
    </div>

    <!-- Back to site -->
    <a href="/" class="back-link">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      Back to Ashmil Homes
    </a>

  </div>

<script>
  /* ============ Icons ============ */
  document.addEventListener('DOMContentLoaded', () => lucide.createIcons());

  /* ============ Elements ============ */
  const form          = document.getElementById('loginForm');
  const emailEl       = document.getElementById('email');
  const passwordEl    = document.getElementById('password');
  const rememberEl    = document.getElementById('remember');
  const toggleBtn     = document.getElementById('togglePassword');
  const submitBtn     = document.getElementById('submitBtn');
  const submitLabel   = document.getElementById('submitLabel');
  const errorBanner   = document.getElementById('errorBanner');
  const errorText     = document.getElementById('errorText');
  const capsWarn      = document.getElementById('capsWarn');

  /* ============ Redirect if already authenticated ============ */
  (function () {
    const token = localStorage.getItem('adminToken');
    if (token) {
      window.location.href = '/admin/dashboard';
    }
  })();

  /* ============ Show / hide password ============ */
  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordEl.type === 'password';
    passwordEl.type = isPassword ? 'text' : 'password';
    toggleBtn.setAttribute('aria-pressed', String(isPassword));
    toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    toggleBtn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>`;
    lucide.createIcons();
  });

  /* ============ Caps Lock detection ============ */
  passwordEl.addEventListener('keyup', (e) => {
    if (typeof e.getModifierState === 'function') {
      const on = e.getModifierState('CapsLock');
      capsWarn.classList.toggle('show', on);
    }
  });
  passwordEl.addEventListener('blur', () => capsWarn.classList.remove('show'));

  /* ============ Error helpers ============ */
  function showError(msg) {
    errorText.textContent = msg;
    errorBanner.classList.add('show');
  }
  function hideError() {
    errorBanner.classList.remove('show');
  }

  /* ============ Field validation ============ */
  function validate() {
    const email = emailEl.value.trim();
    const password = passwordEl.value;

    emailEl.classList.remove('error');
    passwordEl.classList.remove('error');

    if (!email) {
      emailEl.classList.add('error');
      showError('Please enter your email address.');
      emailEl.focus();
      return null;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      emailEl.classList.add('error');
      showError('Please enter a valid email address.');
      emailEl.focus();
      return null;
    }
    if (!password) {
      passwordEl.classList.add('error');
      showError('Please enter your password.');
      passwordEl.focus();
      return null;
    }
    return { email, password };
  }

  /* ============ Clear field error on typing ============ */
  [emailEl, passwordEl].forEach(el => {
    el.addEventListener('input', () => {
      el.classList.remove('error');
      hideError();
    });
  });

  /* ============ Submit ============ */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const creds = validate();
    if (!creds) return;

    // Loading state
    const originalLabel = submitLabel.textContent;
    submitBtn.disabled = true;
    submitLabel.textContent = 'Signing in…';
    const iconEl = submitBtn.querySelector('i');
    if (iconEl) iconEl.replaceWith(Object.assign(document.createElement('span'), { className: 'spinner-dark' }));

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          email: creds.email,
          password: creds.password,
          remember: rememberEl.checked
        })
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok && data.token) {
        localStorage.setItem('adminToken', data.token);
        if (data.user) {
          try { localStorage.setItem('adminUser', JSON.stringify(data.user)); } catch {}
        }
        submitLabel.textContent = 'Welcome';
        // Small delay so the user sees the success state
        setTimeout(() => { window.location.href = '/admin/dashboard'; }, 350);
        return;
      }

      // Handle known failure shapes
      if (res.status === 401 || res.status === 403) {
        showError(data.error || data.message || 'Invalid email or password.');
      } else if (res.status === 429) {
        showError('Too many attempts. Please wait a moment and try again.');
      } else if (res.status >= 500) {
        showError('Server error. Please try again shortly.');
      } else {
        showError(data.error || data.message || 'Sign-in failed. Please try again.');
      }

      // Reset password on auth failure
      passwordEl.value = '';
      passwordEl.focus();
    } catch (err) {
      console.error('Login error:', err);
      showError('Network error. Please check your connection and try again.');
    } finally {
      submitBtn.disabled = false;
      submitLabel.textContent = originalLabel;
      // Restore icon
      const spinner = submitBtn.querySelector('.spinner-dark');
      if (spinner) {
        const icon = document.createElement('i');
        icon.setAttribute('data-lucide', 'log-in');
        icon.className = 'w-4 h-4';
        spinner.replaceWith(icon);
        lucide.createIcons();
      }
    }
  });

  /* ============ Autofocus email on load (desktop only) ============ */
  if (window.matchMedia('(min-width: 768px)').matches) {
    emailEl.focus();
  }
</script>

</body>
</html>
